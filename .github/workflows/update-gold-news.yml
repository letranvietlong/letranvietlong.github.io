name: Update gold news

on:
  schedule:
    # Hourly is plenty for headlines — off the top of the hour on purpose,
    # same reasoning as the price bot (busy slots get queued/skipped).
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install certifi

      - run: python scripts/fetch_gold_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/gold-track/data/gold-news.json
          if git diff --cached --quiet; then
            echo "No news change to commit."
            exit 0
          fi
          git commit -m "Auto-update gold news"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $i failed (branch likely moved), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Giving up after 5 push attempts."
          exit 1
