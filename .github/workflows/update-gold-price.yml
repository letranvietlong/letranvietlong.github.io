name: Update gold price

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold-price
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install certifi

      - run: python scripts/fetch_gold_price.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-price.json data/gold-price-history.json
          if git diff --cached --quiet; then
            echo "No price change to commit."
            exit 0
          fi
          BUY=$(python -c "import json;print(f'{json.load(open(\"data/gold-price.json\"))[\"buy\"]:,}'.replace(',', '.'))")
          SELL=$(python -c "import json;print(f'{json.load(open(\"data/gold-price.json\"))[\"sell\"]:,}'.replace(',', '.'))")
          git commit -m "Auto-update gold price: mua ${BUY} / ban ${SELL}"
          git push
