    /* ══════ styles/tokens.css ══════ */
/* ═════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   Single source of truth for all themeable values.
   Edit here to reskin the entire app.
   ═════════════════════════════════════════════════════════════════════════ */
:root {
  /* ─── Base surfaces ─── */
  --bg-void:     #0e0c1e;
  --bg-deep:     #15132a;
  --bg-panel:    #1a1838;
  --bg-elevated: #221f47;
  --grid-line:   rgba(236, 126, 255, 0.04);

  /* ─── Neon palette (pastel, easier on eyes) ─── */
  --neon-pink:   #ff7ae0;
  --neon-cyan:   #6ee5f5;
  --neon-yellow: #ffe27a;
  --neon-green:  #7cf2a5;
  --neon-purple: #c49bff;
  --neon-peach:  #ffa87a;

  /* ─── Text ─── */
  --text-primary: #f2eeff;
  --text-soft:    #b8b3d6;
  --text-muted:   #7a759a;
  --text-dim:     #4a4569;

  /* ─── Column colors ─── */
  --col-b: var(--neon-pink);
  --col-i: var(--neon-peach);
  --col-n: var(--neon-green);
  --col-g: var(--neon-purple);
  --col-o: var(--neon-cyan);

  /* ─── Radii ─── */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;

  /* ─── Typography ─── */
  --font-display: 'Russo One', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
  --font-body:    'Be Vietnam Pro', sans-serif;

  /* ─── Motion ─── */
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-soft:   cubic-bezier(.22, 1, .36, 1);
}

    /* ══════ styles/base.css ══════ */
/* ═════════════════════════════════════════════════════════════════════════
   BASE
   Reset, body, ambient background effects
   ═════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: var(--bg-void);
}

body {
  font-family: var(--font-body);
  color: var(--text-primary);
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* ─── Grid background (animated) ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 56px 56px;
  z-index: 0;
  pointer-events: none;
  animation: gridShift 32s linear infinite;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
}
@keyframes gridShift {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 56px 56px, 56px 56px; }
}

/* ─── Ambient glow orbs ─── */
.ambient-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  pointer-events: none;
  opacity: 0.32;
  animation: orbFloat 22s ease-in-out infinite;
  will-change: transform;
}
.ambient-glow.pink   { background: var(--neon-pink);   width: 460px; height: 460px; top: -120px;    left: -120px; }
.ambient-glow.cyan   { background: var(--neon-cyan);   width: 400px; height: 400px; bottom: -100px; right: -100px; animation-delay: -11s; }
.ambient-glow.purple { background: var(--neon-purple); width: 340px; height: 340px; top: 40%; right: 20%; animation-delay: -6s; opacity: 0.18; }

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(70px, 50px) scale(1.2); }
}

/* ─── App shell ─── */
.app {
  position: relative;
  z-index: 2;
  max-width: 1240px;
  margin: 0 auto;
  padding: 14px 16px 16px;
}

/* Two-column layout on desktop */
.main-grid {
  display: grid;
  grid-template-columns: minmax(380px, 460px) 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
}

/* ─── Respect reduced motion preference ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  body::before, .ambient-glow { animation: none; }
}

    /* ══════ styles/layout.css ══════ */
/* ═════════════════════════════════════════════════════════════════════════
   LAYOUT — Header, panels, secondary buttons
   ═════════════════════════════════════════════════════════════════════════ */

/* ─── Header — compact inline ─── */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.brand-mark {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neon-cyan);
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.6;
}
.brand-mark::before { content: '‹ '; }
.brand-mark::after  { content: ' ›'; }

.logo {
  display: inline-flex;
  gap: 6px;
}
.logo span {
  font-family: var(--font-display);
  font-size: clamp(32px, 5vw, 46px);
  line-height: 1;
  letter-spacing: 2px;
  display: inline-block;
  animation: neonPulse 3s ease-in-out infinite;
}
.logo span:nth-child(1) { color: var(--col-b); animation-delay: 0s;  }
.logo span:nth-child(2) { color: var(--col-i); animation-delay: .2s; }
.logo span:nth-child(3) { color: var(--col-n); animation-delay: .4s; }
.logo span:nth-child(4) { color: var(--col-g); animation-delay: .6s; }
.logo span:nth-child(5) { color: var(--col-o); animation-delay: .8s; }

@keyframes neonPulse {
  0%, 100% { text-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
  50%      { text-shadow: 0 0 6px currentColor,  0 0 14px currentColor; }
}

.tagline {
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.tagline .divider {
  color: var(--neon-pink);
  margin: 0 8px;
  opacity: 0.7;
}

/* ─── Panel ─── */
.panel {
  background: linear-gradient(145deg, rgba(26, 24, 56, 0.7), rgba(21, 19, 42, 0.7));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--r-lg);
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow:
    0 20px 60px -30px rgba(0, 0, 0, 0.9),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
.panel:last-child { margin-bottom: 0; }
.panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(145deg,
    rgba(255, 122, 224, 0.25),
    rgba(255, 255, 255, 0.02) 30%,
    rgba(255, 255, 255, 0.02) 70%,
    rgba(110, 229, 245, 0.25));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neon-cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title::before {
  content: '◈ ';
  color: var(--neon-pink);
  opacity: 0.8;
}

.panel-body { padding: 14px 16px; }

/* ─── Primary draw button ─── */
.btn-draw {
  flex: 1.4;
  padding: 14px 14px;
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  border: none;
  border-radius: var(--r-md);
  color: #1a1838;
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.25s, filter 0.2s;
  box-shadow:
    0 8px 24px -8px rgba(255, 122, 224, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
}
.btn-draw::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform 0.8s;
}
.btn-draw:hover:not(:disabled)::before { transform: translateX(120%); }
.btn-draw:hover:not(:disabled) {
  box-shadow:
    0 12px 32px -8px rgba(255, 122, 224, 0.75),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transform: translateY(-2px);
  filter: brightness(1.08);
}
.btn-draw:active:not(:disabled) { transform: translateY(-1px); }
.btn-draw:disabled { opacity: 0.35; cursor: not-allowed; }

/* ─── Action button row ─── */
.btn-row {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}

/* ─── Reset button ─── */
.controls-row {
  margin-top: 10px;
  display: flex;
  gap: 10px;
}
.btn-reset {
  flex: 1;
  padding: 10px;
  background: rgba(14, 12, 30, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-soft);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  border-radius: var(--r-md);
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.25s;
}
.btn-reset:hover {
  color: var(--neon-pink);
  border-color: var(--neon-pink);
  background: rgba(255, 122, 224, 0.05);
  box-shadow: 0 0 16px rgba(255, 122, 224, 0.3);
}

    /* ══════ styles/slot.css ══════ */
/* ═════════════════════════════════════════════════════════════════════════
   SLOT MACHINE — Stage, display cluster, status, recent strip
   ═════════════════════════════════════════════════════════════════════════ */

.slot-stage {
  background:
    radial-gradient(ellipse at center top,    rgba(255, 122, 224, 0.1) 0%, transparent 55%),
    radial-gradient(ellipse at center bottom, rgba(110, 229, 245, 0.08) 0%, transparent 55%),
    rgba(14, 12, 30, 0.5);
  padding: 18px 16px 14px;
  border-radius: var(--r-md);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hud-corner {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--neon-cyan);
  letter-spacing: 2px;
  opacity: 0.45;
}
.hud-corner.tl { top: 8px; left: 12px; }
.hud-corner.tr { top: 8px; right: 12px; }

/* ─── Display cluster (letter + number) ─── */
.display-cluster {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin: 10px 0 14px;
}

.letter-badge {
  width: 64px;
  height: 78px;
  border-radius: var(--r-md);
  background: linear-gradient(145deg, rgba(34, 31, 71, 0.6), rgba(21, 19, 42, 0.6));
  border: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 36px;
  color: var(--text-dim);
  transition: all 0.45s var(--ease-spring);
}
.letter-badge.active {
  border-color: currentColor;
  background:
    radial-gradient(ellipse at center, rgba(255, 122, 224, 0.08), transparent),
    linear-gradient(145deg, rgba(34, 31, 71, 0.8), rgba(21, 19, 42, 0.8));
  box-shadow:
    0 0 24px currentColor,
    0 0 48px currentColor,
    inset 0 0 16px rgba(255, 255, 255, 0.04);
  text-shadow: 0 0 18px currentColor;
}

/* ─── Number window ─── */
.number-window {
  width: 150px;
  height: 120px;
  background: radial-gradient(ellipse at center, rgba(14, 12, 30, 0.9), rgba(10, 8, 22, 1));
  border: 1px solid rgba(110, 229, 245, 0.3);
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 32px rgba(110, 229, 245, 0.12),
    inset 0 0 40px rgba(0, 0, 0, 0.6);
}
/* Scanlines */
.number-window::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(110, 229, 245, 0.025) 3px,
    rgba(110, 229, 245, 0.025) 4px
  );
  pointer-events: none;
  z-index: 2;
}
/* Horizon line */
.number-window::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  opacity: 0.5;
  filter: blur(1px);
}

#slotDisplay {
  font-family: var(--font-display);
  font-size: 58px;
  line-height: 1;
  color: var(--text-primary);
  position: relative;
  z-index: 1;
  will-change: transform, opacity;
  letter-spacing: 1px;
}

#slotDisplay.glitch { animation: glitchText 0.09s infinite; }
@keyframes glitchText {
  0%   { transform: translate(0, 0);      text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
  33%  { transform: translate(-1px, 1px); text-shadow: -1px 0 var(--neon-pink), 1px 0 var(--neon-cyan); }
  66%  { transform: translate(1px, -1px); text-shadow: 1px 1px var(--neon-pink), -1px -1px var(--neon-cyan); }
  100% { transform: translate(0, 0);      text-shadow: 0 0 14px currentColor; }
}

#slotDisplay.locked { animation: lockedPulse 2s ease-in-out infinite; }
@keyframes lockedPulse {
  0%, 100% { text-shadow: 0 0 18px currentColor, 0 0 36px currentColor; }
  50%      { text-shadow: 0 0 28px currentColor, 0 0 56px currentColor, 0 0 84px currentColor; }
}

/* ─── Status line ─── */
.status-line {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 4px;
  min-height: 22px;
}
.status-line .tag {
  display: inline-block;
  padding: 2px 9px;
  border: 1px solid currentColor;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 8px;
  letter-spacing: 2px;
}
.status-line .val {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 3px;
}

.status-sub {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  font-family: var(--font-mono);
}

/* ─── Recent draws strip ─── */
.last-strip-wrap {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed rgba(255, 255, 255, 0.06);
}
.strip-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.last-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0;
  scrollbar-width: none;
  min-height: 32px;
  align-items: center;
}
.last-strip::-webkit-scrollbar { display: none; }

.last-strip:empty::before {
  content: '— chưa có số nào —';
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  width: 100%;
  text-align: center;
}

.last-chip {
  flex-shrink: 0;
  min-width: 44px;
  height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: var(--font-display);
  font-size: 13px;
  border: 1px solid;
  animation: chipIn 0.4s var(--ease-spring);
}
@keyframes chipIn {
  from { transform: scale(0) rotate(-90deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);    opacity: 1; }
}
.last-chip .ltr {
  font-family: var(--font-mono);
  font-size: 10px;
  opacity: 0.75;
  font-weight: 400;
}
.last-chip.b { color: var(--col-b); border-color: var(--col-b); background: rgba(255, 122, 224, 0.08); box-shadow: 0 0 16px rgba(255, 122, 224, 0.35); }
.last-chip.i { color: var(--col-i); border-color: var(--col-i); background: rgba(255, 168, 122, 0.08); box-shadow: 0 0 16px rgba(255, 168, 122, 0.35); }
.last-chip.n { color: var(--col-n); border-color: var(--col-n); background: rgba(124, 242, 165, 0.08); box-shadow: 0 0 16px rgba(124, 242, 165, 0.35); }
.last-chip.g { color: var(--col-g); border-color: var(--col-g); background: rgba(196, 155, 255, 0.08); box-shadow: 0 0 16px rgba(196, 155, 255, 0.35); }
.last-chip.o { color: var(--col-o); border-color: var(--col-o); background: rgba(110, 229, 245, 0.08); box-shadow: 0 0 16px rgba(110, 229, 245, 0.35); }

    /* ══════ styles/auto.css ══════ */
/* ═════════════════════════════════════════════════════════════════════════
   AUTO-DRAW PANEL — Auto button, interval input, presets, countdown
   ═════════════════════════════════════════════════════════════════════════ */

/* ─── Auto button (paired with draw button) ─── */
.btn-auto {
  flex: 1;
  padding: 10px 14px;
  background: linear-gradient(145deg, rgba(110, 229, 245, 0.08), rgba(196, 155, 255, 0.05));
  border: 1px solid rgba(110, 229, 245, 0.3);
  border-radius: var(--r-md);
  color: var(--neon-cyan);
  font-family: var(--font-display);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s var(--ease-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  white-space: nowrap;
}
.btn-auto:hover:not(:disabled) {
  border-color: var(--neon-cyan);
  background: linear-gradient(145deg, rgba(110, 229, 245, 0.14), rgba(196, 155, 255, 0.1));
  box-shadow: 0 0 28px rgba(110, 229, 245, 0.35);
  transform: translateY(-2px);
}
.btn-auto:disabled { opacity: 0.35; cursor: not-allowed; }

/* Icon circle on the left */
.btn-auto .btn-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(110, 229, 245, 0.15);
  border: 1px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  transition: all 0.4s var(--ease-soft);
}
.btn-auto .btn-icon::before {
  /* Play triangle by default */
  content: '';
  width: 0;
  height: 0;
  border-left: 7px solid currentColor;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  margin-left: 2px;
  transition: all 0.3s var(--ease-spring);
}

/* Label stack on the right */
.btn-auto .btn-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 0;
}
.btn-auto .btn-label {
  font-size: 13px;
  letter-spacing: 2px;
  line-height: 1;
}
.btn-auto .btn-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-muted);
  font-weight: 400;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.btn-auto .btn-meta strong {
  color: var(--neon-yellow);
  font-weight: 700;
  font-family: var(--font-display);
  font-size: 14px;
  text-shadow: 0 0 10px rgba(255, 226, 122, 0.6);
  transition: color 0.3s;
}

/* ═══ ON state ═══ */
.btn-auto.on {
  background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
  border-color: transparent;
  color: #15132a;
  box-shadow:
    0 12px 32px -10px rgba(110, 229, 245, 0.65),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
  animation: autoPulse 2.4s ease-in-out infinite;
}
.btn-auto.on .btn-icon {
  background: rgba(21, 19, 42, 0.25);
  border-color: transparent;
  animation: iconSpin 3s linear infinite;
}
.btn-auto.on .btn-icon::before {
  /* Double pause bars when running */
  content: '';
  width: 10px;
  height: 12px;
  border: none;
  margin: 0;
  background:
    linear-gradient(to right,
      currentColor 0%, currentColor 30%,
      transparent 30%, transparent 70%,

(() => {
  'use strict';

  // ══════ scripts/config.js ══════
/**
 * Game configuration constants.
 * Frozen to prevent accidental mutation at runtime.
 */

const COLUMNS = Object.freeze({
  B: { range: [1,  15], color: 'b', cssVar: '--col-b' },
  I: { range: [16, 30], color: 'i', cssVar: '--col-i' },
  N: { range: [31, 45], color: 'n', cssVar: '--col-n' },
  G: { range: [46, 60], color: 'g', cssVar: '--col-g' },
  O: { range: [61, 75], color: 'o', cssVar: '--col-o' },
});

const COL_ORDER = Object.freeze(['B', 'I', 'N', 'G', 'O']);

/** Total numbers in the pool. */
const POOL_SIZE = 75;

/** Auto-draw interval bounds (seconds). */
const INTERVAL = Object.freeze({
  MIN: 2,
  MAX: 60,
  DEFAULT: 5,
});

/** Slot animation timing (milliseconds). */
const SLOT = Object.freeze({
  SPIN_DURATION: 1200,
  TICK_BASE: 45,
  TICK_EASING_MAX: 200,
  CALLBACK_DELAY: 250,
});

/** Max items kept in the recent-draws strip. */
const RECENT_STRIP_MAX = 12;

/**
 * Map a number (1-75) to its column letter.
 * Returns null if out of range.
 * @param {number} n
 * @returns {string|null}
 */
function getColumnFor(n) {
  for (const col of COL_ORDER) {
    const [min, max] = COLUMNS[col].range;
    if (n >= min && n <= max) return col;
  }
  return null;
}

  // ══════ scripts/state.js ══════
/**
 * Game state — single source of truth.
 *
 * All reads happen via getters; all writes happen via explicit actions.
 * Anyone can subscribe to state changes via `subscribe()`.
 */


/* ─── Private state ─── */

const state = {
  pool: [],            // Remaining numbers (top of stack = next draw)
  drawn: new Set(),    // Numbers already drawn
  isSpinning: false,   // True while slot animation plays
  isAutoOn: false,     // True when auto-draw is active
  interval: INTERVAL.DEFAULT,
};

/* ─── Subscribers ─── */

const subscribers = new Set();

function notify(event) {
  for (const fn of subscribers) {
    try {
      fn(event);
    } catch (err) {
      console.error('[state] subscriber error:', err);
    }
  }
}

/* ─── Utilities ─── */

/**
 * Fisher-Yates shuffle. Mutates `arr` in place.
 * @template T
 * @param {T[]} arr
 * @returns {T[]}
 */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ─── Public API ─── */

const gameState = {
  /** Subscribe to state change events. Returns unsubscribe fn. */
  subscribe(fn) {
    subscribers.add(fn);
    return () => subscribers.delete(fn);
  },

  /** True if no more numbers left to draw. */
  get isExhausted() { return state.pool.length === 0; },

  /** True while slot animation is running. */
  get isSpinning() { return state.isSpinning; },

  /** Count of numbers drawn so far. */
  get drawCount() { return state.drawn.size; },

  /** True if auto-draw is active. */
  get isAutoOn() { return state.isAutoOn; },

  /** Current auto-draw interval (seconds). */
  get interval() { return state.interval; },

  /** Iterable of drawn numbers. */
  get drawnNumbers() { return state.drawn; },

  /** Reset pool and drawn set. */
  resetPool() {
    state.pool = Array.from({ length: POOL_SIZE }, (_, i) => i + 1);
    shuffle(state.pool);
    state.drawn.clear();
    notify({ type: 'reset' });
  },

  /**
   * Pop the next number from the pool. Returns null if empty.
   * Also adds the number to the drawn set.
   */
  drawNext() {
    if (state.pool.length === 0) return null;
    const n = state.pool.pop();
    state.drawn.add(n);
    notify({ type: 'draw', number: n });
    return n;
  },

  setSpinning(isSpinning) {
    state.isSpinning = isSpinning;
  },

  setAutoOn(isOn) {
    state.isAutoOn = isOn;
    notify({ type: 'auto-changed', isOn });
  },

  /**
   * Set auto-draw interval (seconds).
   * Clamped to [INTERVAL.MIN, INTERVAL.MAX].
   */
  setInterval(seconds) {
    const clamped = Math.min(INTERVAL.MAX, Math.max(INTERVAL.MIN, seconds | 0));
    state.interval = clamped;
    notify({ type: 'interval-changed', seconds: clamped });
    return clamped;
  },
};

  // ══════ scripts/dom.js ══════
/**
 * DOM references — resolved once at startup.
 *
 * Calling `cacheDom()` populates `dom` with every element the app needs.
 * Throws if any required element is missing (fail-fast on startup).
 */

const dom = {};

const REQUIRED_IDS = [
  'slotDisplay',
  'slotLetter',
  'statusLine',
  'statusSub',
  'drawCounter',
  'engineStatus',
  'lastStrip',
  'btnDraw',
  'btnAuto',
  'btnAutoSec',
  'intervalInput',
  'presetChips',
  'countdownWrap',
  'countdownTimer',
  'progressFill',
  'rangeGroups',
  'drawnCount',
];

function cacheDom() {
  for (const id of REQUIRED_IDS) {
    const el = document.getElementById(id);
    if (!el) throw new Error(`[dom] required element not found: #${id}`);
    dom[id] = el;
  }
}

  // ══════ scripts/board.js ══════
/**
 * Number matrix board — 5 grouped ranges (B/I/N/G/O).
 *
 * Built once on init using a single DocumentFragment to minimize reflow.
 * Cells are referenced by id (`cell-${n}`) for O(1) lookup during marking.
 */



/** Map: number → cached cell element, set after build. */
const cellCache = new Map();

/** Map: column letter → count element, set after build. */
const groupCountCache = new Map();

/**
 * Build the number matrix into `dom.rangeGroups`.
 * Idempotent — clears existing content before rebuilding.
 */
function buildBoard() {
  cellCache.clear();
  groupCountCache.clear();

  const fragment = document.createDocumentFragment();

  for (const col of COL_ORDER) {
    const { range, cssVar } = COLUMNS[col];
    const [min, max] = range;

    const group = document.createElement('div');
    group.className = 'range-group';
    group.style.setProperty('--group-color', `var(${cssVar})`);

    // Header
    const header = document.createElement('div');
    header.className = 'range-header';

    const label = document.createElement('div');
    label.className = 'range-label';
    label.innerHTML = `
      <span class="range-letter">${col}</span>
      <span class="range-numbers">${min}–${max}</span>
    `;

    const count = document.createElement('span');
    count.className = 'range-count';
    const done = document.createElement('span');
    done.className = 'done';
    done.textContent = '0';
    count.append(done, `/${max - min + 1}`);
    groupCountCache.set(col, done);

    header.append(label, count);
    group.appendChild(header);

    // Grid of cells
    const grid = document.createElement('div');
    grid.className = 'range-grid';

    for (let n = min; n <= max; n++) {
      const cell = document.createElement('div');
      cell.className = 'num-cell';
      cell.textContent = String(n);
      grid.appendChild(cell);
      cellCache.set(n, cell);
    }

    group.appendChild(grid);
    fragment.appendChild(group);
  }

  dom.rangeGroups.replaceChildren(fragment);
}

/**
 * Mark a cell as drawn.
 * @param {number} n
 * @param {string} col - column letter (B/I/N/G/O)
 */
function markCell(n, col) {
  const cell = cellCache.get(n);
  if (!cell) return;
  const { cssVar } = COLUMNS[col];
  cell.style.setProperty('--group-color', `var(${cssVar})`);
  cell.classList.add('drawn');
}

/**
 * Update the "done count" label for a given group.
 * @param {string} col
 * @param {Set<number>} drawnSet
 */
function updateGroupCount(col, drawnSet) {
  const el = groupCountCache.get(col);
  if (!el) return;
  const [min, max] = COLUMNS[col].range;
  let count = 0;
  for (let n = min; n <= max; n++) {
    if (drawnSet.has(n)) count++;
  }
  el.textContent = String(count);
}

  // ══════ scripts/draw-engine.js ══════
/**
 * Draw engine — coordinates drawing a number, animating the slot,
 * and updating all dependent UI.
 *
 * Slot animation uses `requestAnimationFrame` for smooth 60fps
 * instead of chained setTimeout which is subject to drift and
 * throttling in background tabs.
 */





/**
 * Draw the next number. No-op if already spinning or pool exhausted.
 * @returns {Promise<number|null>} the drawn number, or null if nothing drawn
 */
async function drawNumber() {
  if (gameState.isSpinning || gameState.isExhausted) return null;

  gameState.setSpinning(true);
  setButtonDisabled(true);
  setEngineStatus('drawing');

  const n = gameState.drawNext();
  const col = getColumnFor(n);

  await spinSlot(n, col);

  // Post-draw UI updates
  markCell(n, col);
  updateGroupCount(col, gameState.drawnNumbers);
  addRecentChip(n, col);
  updateDrawnCount();

  gameState.setSpinning(false);

  if (gameState.isExhausted) {
    setButtonDisabled(true);
    setExhaustedStatus();
  } else {
    setButtonDisabled(false);
    setEngineStatus('active');
  }

  return n;
}

/**
 * Animate the slot machine to reveal the target number.
 * Uses RAF with a time-based easing curve — ticks get slower near the end.
 *
 * @param {number} finalNumber
 * @param {string} col - column letter
 * @returns {Promise<void>}
 */
function spinSlot(finalNumber, col) {
  return new Promise((resolve) => {
    const { slotDisplay, slotLetter } = dom;
    const info = COLUMNS[col];
    const colorVar = `var(${info.cssVar})`;

    // Reset letter badge (hidden until final)
    slotLetter.className = 'letter-badge';
    slotLetter.textContent = '?';
    slotLetter.style.color = '';

    // Start glitch phase
    slotDisplay.className = 'glitch';
    slotDisplay.style.color = colorVar;

    const startTime = performance.now();
    let lastTickAt = 0;

    function frame(now) {
      const elapsed = now - startTime;
      const progress = elapsed / SLOT.SPIN_DURATION;

      if (progress < 1) {
        // Ease-in curve: ticks slow down as we approach the target
        const eased = progress * progress;
        const tickInterval = SLOT.TICK_BASE + (eased * SLOT.TICK_EASING_MAX);

        if (now - lastTickAt >= tickInterval) {
          const fake = Math.floor(Math.random() * POOL_SIZE) + 1;
          slotDisplay.textContent = formatTwoDigits(fake);
          lastTickAt = now;
        }
        requestAnimationFrame(frame);
      } else {
        // Lock in final value
        slotDisplay.classList.remove('glitch');
        slotDisplay.classList.add('locked');
        slotDisplay.textContent = formatTwoDigits(finalNumber);
        slotDisplay.style.color = colorVar;

        // Activate letter badge
        slotLetter.classList.add('active');
        slotLetter.textContent = col;
        slotLetter.style.color = colorVar;

        // Status line + HUD counter
        dom.statusLine.innerHTML = `
          <span class="tag" style="color: ${colorVar}; border-color: ${colorVar}">${col}</span>
          <span class="val" style="color: ${colorVar}">${finalNumber}</span>
        `;
        dom.statusSub.textContent = `// CỘT ${col} · SỐ ${info.range[0]} → ${info.range[1]}`;
        dom.drawCounter.textContent = `#${String(gameState.drawCount).padStart(3, '0')}`;

        setTimeout(resolve, SLOT.CALLBACK_DELAY);
      }
    }

    requestAnimationFrame(frame);
  });
}

/* ─── UI helpers ─── */

function formatTwoDigits(n) {
  return n < 10 ? `0${n}` : String(n);
}

function setButtonDisabled(disabled) {
  dom.btnDraw.disabled = disabled;
}

function setEngineStatus(kind) {
  const { engineStatus } = dom;
  switch (kind) {
    case 'drawing':
      engineStatus.textContent = '● ĐANG QUAY...';
      engineStatus.style.color = 'var(--neon-yellow)';
      break;
    case 'active':
      engineStatus.textContent = '● HOẠT ĐỘNG';
      engineStatus.style.color = 'var(--neon-green)';
      break;
    case 'standby':
      engineStatus.textContent = '● SẴN SÀNG';
      engineStatus.style.color = 'var(--neon-pink)';
      break;
  }
}

function setExhaustedStatus() {
  dom.statusLine.innerHTML =
    `<span style="color: var(--neon-yellow)">// ĐÃ QUAY HẾT 75 SỐ</span>`;
  dom.statusSub.textContent = 'Nhấn CHƠI LẠI để bắt đầu ván mới';
}

function addRecentChip(n, col) {
  const chip = document.createElement('div');
  chip.className = `last-chip ${COLUMNS[col].color}`;
  chip.innerHTML = `<span class="ltr">${col}</span>${n}`;
  dom.lastStrip.insertBefore(chip, dom.lastStrip.firstChild);

  // Trim excess
  while (dom.lastStrip.childElementCount > RECENT_STRIP_MAX) {
    dom.lastStrip.lastElementChild.remove();
  }
}

function updateDrawnCount() {
  dom.drawnCount.textContent = String(gameState.drawCount);
}

/**
 * Reset slot display and recent strip to initial state.
 * Does not touch game state — call after `gameState.resetPool()`.
 */
function resetEngine() {
  const { slotDisplay, slotLetter } = dom;

  slotDisplay.className = '';
  slotDisplay.textContent = '00';
  slotDisplay.style.color = '';

  slotLetter.className = 'letter-badge';
  slotLetter.textContent = '—';
  slotLetter.style.color = '';

  dom.statusLine.innerHTML =
    `<span style="color: var(--text-muted)">// CHỜ THAO TÁC</span>`;
  dom.statusSub.textContent = 'Nhấn QUAY SỐ để bắt đầu';
  dom.drawCounter.textContent = '#000';
  dom.lastStrip.replaceChildren();
  dom.drawnCount.textContent = '0';
  setButtonDisabled(false);
  setEngineStatus('standby');
}

  // ══════ scripts/auto-draw.js ══════
/**
 * Auto-draw controller.
 *
 * Manages the auto-draw interval + a visual countdown bar.
 * Countdown timer uses `performance.now()` for drift-free timing
 * and only updates the text every 100ms.
 */





let autoTimer = null;
let countdownRaf = null;
let countdownStart = 0;

/** Start auto-draw at the current interval. */
function startAuto() {
  stopAuto(/* keepUi */ true);

  if (gameState.isExhausted) {
    stopAuto();
    return;
  }

  gameState.setAutoOn(true);
  dom.btnAuto.classList.add('on');

  const intervalMs = gameState.interval * 1000;

  const tick = async () => {
    if (gameState.isExhausted) { stopAuto(); return; }
    await drawNumber();
    startCountdown();
  };

  // Fire immediately, then schedule
  tick();
  autoTimer = setInterval(tick, intervalMs);
}

/**
 * Stop auto-draw.
 * @param {boolean} [keepUi] - if true, leave button "on" state intact
 *   (used internally when restarting with new interval).
 */
function stopAuto(keepUi = false) {
  if (autoTimer !== null) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
  if (countdownRaf !== null) {
    cancelAnimationFrame(countdownRaf);
    countdownRaf = null;
  }

  if (!keepUi) {
    gameState.setAutoOn(false);
    dom.btnAuto.classList.remove('on');
  }

  dom.countdownWrap.classList.remove('visible');
  dom.progressFill.style.transition = 'none';
  dom.progressFill.style.width = '100%';
}

/** Toggle auto-draw on/off. */
function toggleAuto() {
  if (gameState.isAutoOn) stopAuto();
  else startAuto();
}

/**
 * If auto-draw is running, restart it so the new interval takes effect
 * starting from the next tick.
 */
function applyIntervalChange() {
  if (gameState.isAutoOn) startAuto();
}

/* ─── Countdown visuals ─── */

function startCountdown() {
  if (countdownRaf !== null) cancelAnimationFrame(countdownRaf);

  const totalMs = gameState.interval * 1000;
  countdownStart = performance.now();

  dom.countdownWrap.classList.add('visible');

  // Restart CSS transition on progress bar
  const fill = dom.progressFill;
  fill.style.transition = 'none';
  fill.style.width = '100%';
  // Force reflow so transition restarts reliably
  void fill.offsetWidth;
  fill.style.transition = `width ${totalMs}ms linear`;
  fill.style.width = '0%';

  // Drive the numeric readout with RAF (~60fps) — more efficient than
  // a setInterval + doesn't drift relative to the CSS bar.
  const tick = (now) => {
    const elapsed = now - countdownStart;
    const remaining = Math.max(0, totalMs - elapsed);
    dom.countdownTimer.textContent = `${(remaining / 1000).toFixed(1)}s`;
    if (remaining > 0) {
      countdownRaf = requestAnimationFrame(tick);
    } else {
      countdownRaf = null;
    }
  };
  countdownRaf = requestAnimationFrame(tick);
}

  // ══════ scripts/main.js ══════
/**
 * App entry point.
 *
 * Responsibilities:
 *   1. Cache DOM references.
 *   2. Build the number matrix once.
 *   3. Reset game state.
 *   4. Wire event listeners (using event delegation where possible).
 *
 * No global functions — everything is scoped to this module.
 */







/* ─── Boot ─── */

function boot() {
  cacheDom();
  buildBoard();
  gameState.resetPool();
  resetEngine();
  wireEvents();
  syncIntervalUi(gameState.interval);
}

/* ─── Event wiring ─── */

function wireEvents() {
  // Primary actions
  dom.btnDraw.addEventListener('click', () => {
    drawNumber().catch(err => console.error('[draw] failed:', err));
  });
  dom.btnAuto.addEventListener('click', toggleAuto);

  // Reset button lives outside our panel; find by id once
  const resetBtn = document.getElementById('btnReset');
  if (resetBtn) resetBtn.addEventListener('click', handleReset);

  // Interval input: change + input both call the handler
  const handleIntervalInput = () => {
    const raw = parseInt(dom.intervalInput.value, 10);
    const clamped = gameState.setInterval(Number.isFinite(raw) ? raw : INTERVAL.DEFAULT);
    syncIntervalUi(clamped);
    applyIntervalChange();
  };
  dom.intervalInput.addEventListener('input', handleIntervalInput);
  dom.intervalInput.addEventListener('change', handleIntervalInput);

  // Stepper buttons (+/-) — delegated via parent
  document.querySelectorAll('.stepper-btn').forEach(btn => {
    const delta = Number(btn.dataset.delta);
    btn.addEventListener('click', () => {
      const next = gameState.interval + delta;
      const clamped = gameState.setInterval(next);
      dom.intervalInput.value = String(clamped);
      syncIntervalUi(clamped);
      applyIntervalChange();
    });
  });

  // Preset chips: one delegated handler on the container
  dom.presetChips.addEventListener('click', (e) => {
    const chip = e.target.closest('.preset-chip');
    if (!chip) return;
    const sec = Number(chip.dataset.sec);
    if (!Number.isFinite(sec)) return;
    const clamped = gameState.setInterval(sec);
    dom.intervalInput.value = String(clamped);
    syncIntervalUi(clamped);
    applyIntervalChange();
  });

  // Keyboard shortcuts for power users
  document.addEventListener('keydown', handleKeydown);
}

function handleKeydown(e) {
  // Ignore when typing in the interval input
  if (e.target === dom.intervalInput) return;

  switch (e.code) {
    case 'Space':
    case 'Enter':
      e.preventDefault();
      if (!dom.btnDraw.disabled) drawNumber();
      break;
    case 'KeyA':
      e.preventDefault();
      toggleAuto();
      break;
    case 'KeyR':
      if (e.shiftKey) {
        e.preventDefault();
        handleReset();
      }
      break;
  }
}

function handleReset() {
  stopAuto();
  gameState.resetPool();
  buildBoard();
  resetEngine();
}

/**
 * Sync all interval-dependent UI elements:
 *   - the `btn-auto` meta label
 *   - the active preset chip
 *
 * @param {number} seconds
 */
function syncIntervalUi(seconds) {
  dom.btnAutoSec.textContent = String(seconds);

  for (const chip of dom.presetChips.querySelectorAll('.preset-chip')) {
    const chipSec = Number(chip.dataset.sec);
    chip.classList.toggle('active', chipSec === seconds);
  }
}

/* ─── Start ─── */

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
  </script>
