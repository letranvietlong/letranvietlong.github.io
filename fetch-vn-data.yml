name: Fetch VN Stock Data

on:
  schedule:
    # Chạy mỗi 5 phút trong giờ giao dịch VN (UTC 1:00-10:00 = 8h-17h UTC+7)
    - cron: '*/5 1-10 * * 1-5'
    # Chạy 1 lần/giờ ngoài giờ giao dịch để có dữ liệu cơ bản
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch VN stock data
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, time, os, traceback
          from datetime import datetime, timezone, timedelta

          VN30 = ['ACB','BCM','BID','BVH','CTG','FPT','GAS','GVR','HDB','HPG',
                  'MBB','MSN','MWG','NVL','PDR','PLX','PNJ','POW','SAB','SHB',
                  'SSI','STB','TCB','TPB','VCB','VHM','VIB','VIC','VJC','VNM',
                  'VPB','VRE','VND','KDH','DXG']
          HNX  = ['SHB','PVS','NTP','VCS','TNG','SHS','CEO','DGC','MBS','HUT',
                  'VGC','KLF','BVS','IDJ','PVI','SCR','PGI','VIF','WSS','HHC']
          INDICES = ['VNINDEX','HNXINDEX','UPCOMINDEX']
          TCBS = 'https://apipubaws.tcbs.com.vn/stock-insight/v1/stock'
          VND  = 'https://finfo-api.vndirect.com.vn/v4/stock_prices'

          HEADERS = {
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0 (compatible; VietLongCrypto/2.0)',
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode())

          now = int(time.time())
          result = {'updated': now, 'indices': {}, 'stocks': []}

          # === FETCH INDICES ===
          for sym in INDICES:
              try:
                  from_ts = now - 10 * 86400
                  url = f'{TCBS}/bars-long-term?ticker={sym}&type=index&resolution=D&from={from_ts}&to={now}'
                  d = fetch(url)
                  arr = d if isinstance(d, list) else d.get('data', [])
                  if arr and len(arr) >= 2:
                      last = arr[-1]; prev = arr[-2]
                      val  = float(last.get('close') or last.get('c') or 0)
                      pval = float(prev.get('close') or prev.get('c') or val)
                      if val > 0:
                          result['indices'][sym] = {
                              'value': round(val, 2),
                              'chg':   round(val - pval, 2),
                              'pct':   round((val - pval) / pval * 100, 2) if pval else 0,
                              'vol':   int(last.get('volume') or last.get('v') or 0),
                              'hi':    float(last.get('high') or last.get('h') or val),
                              'lo':    float(last.get('low')  or last.get('l') or val),
                          }
                          print(f'  {sym}: {val}')
              except Exception as e:
                  print(f'  ERROR {sym}: {e}')

          # === FETCH STOCKS (VNDirect) ===
          all_syms = list(dict.fromkeys(VN30 + HNX))
          for i in range(0, len(all_syms), 10):
              chunk = all_syms[i:i+10]
              try:
                  q = '~or~'.join(f'code:{s}' for s in chunk)
                  url = f'{VND}/?sort=-date&size={len(chunk)}&page=1&q={urllib.parse.quote(q)}'
                  import urllib.parse
                  url = f'{VND}/?sort=-date&size={len(chunk)}&page=1&q={urllib.parse.quote(q)}'
                  d = fetch(url)
                  rows = d.get('data', [])
                  for r in rows:
                      sym = r.get('code') or r.get('symbol') or ''
                      p   = float(r.get('close') or r.get('adClose') or 0)
                      ref = float(r.get('refPrice') or r.get('open') or p)
                      if sym and p > 0:
                          result['stocks'].append({
                              'sym': sym,
                              'price': p, 'ref': ref,
                              'ceil':  round(ref * 1.07),
                              'floor': round(ref * 0.93),
                              'chg':   round(p - ref, 2),
                              'pct':   round((p - ref) / ref * 100, 2) if ref else 0,
                              'vol':   int(r.get('nmVolume') or r.get('volume') or 0),
                              'val':   float(r.get('nmValue') or r.get('value') or 0),
                              'hi':    float(r.get('high') or p),
                              'lo':    float(r.get('low')  or p),
                              'floor_id': 'hnx' if sym in HNX else 'vn30',
                          })
                  print(f'  VND batch {i//10+1}: {len(rows)} stocks')
              except Exception as e:
                  print(f'  ERROR VND batch {i//10+1}: {e}')
                  # Fallback: TCBS per stock
                  for sym in chunk:
                      try:
                          from_ts = now - 7 * 86400
                          url = f'{TCBS}/bars-long-term?ticker={sym}&type=stock&resolution=D&from={from_ts}&to={now}'
                          d = fetch(url)
                          arr = d if isinstance(d, list) else d.get('data', [])
                          if arr:
                              last = arr[-1]; prev = arr[-2] if len(arr) > 1 else last
                              p    = float(last.get('close') or last.get('c') or 0)
                              ref  = float(prev.get('close') or prev.get('c') or p)
                              if p > 0:
                                  result['stocks'].append({
                                      'sym': sym, 'price': p, 'ref': ref,
                                      'ceil': round(ref*1.07), 'floor': round(ref*0.93),
                                      'chg': round(p-ref,2),
                                      'pct': round((p-ref)/ref*100,2) if ref else 0,
                                      'vol': int(last.get('volume') or last.get('v') or 0),
                                      'val': 0,
                                      'hi': float(last.get('high') or last.get('h') or p),
                                      'lo': float(last.get('low')  or last.get('l') or p),
                                      'floor_id': 'hnx' if sym in HNX else 'vn30',
                                  })
                      except Exception as e2:
                          print(f'    TCBS {sym}: {e2}')

          print(f'\nResult: {len(result["indices"])} indices, {len(result["stocks"])} stocks')

          os.makedirs('data', exist_ok=True)
          with open('data/vn-market.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, separators=(',',':'))
          print('Saved data/vn-market.json')
          PYEOF

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vn-market.json
          # Chỉ commit nếu có thay đổi
          git diff --staged --quiet || git commit -m "chore: update VN market data [skip ci]"
          git push
